name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: Linux
            os: ubuntu-latest
            cmake_args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          ART=build/SampleManager_artefacts/Release
          cp -R "$ART/Standalone/"* dist/ 2>/dev/null || true
          cp -R "$ART/VST3/"* dist/ 2>/dev/null || true
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/"* dist/; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SampleManager-${{ matrix.name }}
          path: dist
